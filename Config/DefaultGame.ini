; Silences the "Asset Manager settings do not include an entry for assets of type
; GameFeatureData" startup prompt. Caused by the AllToolsets MCP editor-tooling plugin (enabled in
; ZombieShooter.uproject) bundling GameFeaturesToolset, which pulls in the engine's GameFeatures
; plugin - this project has no GameFeatureData assets and doesn't use Game Features/Modular
; Gameplay at all (see CLAUDE.md's scope), so this entry just tells the Asset Manager "scan for
; this type, expect to find none" rather than leaving it unconfigured. Same entry the editor's own
; "Add entry to PrimaryAssetTypesToScan?" dialog would write if you clicked Yes.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/GameFeatures")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
